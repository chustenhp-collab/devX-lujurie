<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>devX lujurie.web</title>
    <style>
        :root {
            --bg-base: #090305;
            --surface: #14080c;
            --surface-hover: #220d14;
            --accent: #e11d48;
            --border: #38121d;
            --text-main: #ffeeef;
            --text-muted: #b898a1;
            --danger: #ff2a5f;
            --admin: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        /* Intro Video */
        #introVideoModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.6s ease;
        }
        #introVideoModal video { width: 100%; height: 100%; object-fit: cover; }
        .skip-video-btn {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(20, 8, 12, 0.85); color: var(--text-main);
            border: 1px solid var(--border); padding: 10px 20px; font-size: 0.85rem; cursor: pointer; z-index: 10001;
        }

        /* Gatekeeper & Auth */
        #gatekeeperModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(9, 3, 5, 0.97); backdrop-filter: blur(16px);
            z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center;
        }
        .gate-card {
            background: var(--surface); border: 1px solid var(--border); padding: 32px 24px;
            max-width: 400px; width: 100%; display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }
        .gate-logo { font-size: 1.8rem; font-weight: 800; color: #fff; }
        .gate-logo span { color: var(--danger); }
        .gate-title { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .gate-btns { display: flex; gap: 12px; }
        .btn { flex: 1; padding: 12px; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--surface-hover); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-admin { background: var(--admin); color: black; font-weight: 700; }
        .auth-input { width: 100%; padding: 14px 16px; border: 1px solid var(--border); background: var(--bg-base); color: #fff; text-align: center; font-size: 1.05rem; outline: none; }

        /* Avatares */
        .avatar-img { width: 32px; height: 32px; border-radius: 50% !important; object-fit: cover; border: 1px solid var(--border); }
        .avatar-img-lg { width: 48px; height: 48px; border-radius: 50% !important; object-fit: cover; border: 2px solid var(--accent); }

        /* Contenedor App */
        .app-container {
            width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px;
            filter: blur(16px); pointer-events: none; transition: filter 0.5s ease;
        }
        .app-container.unlocked { filter: blur(0); pointer-events: auto; }

        header {
            background: var(--surface); border: 1px solid var(--border); padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand-title { font-size: 1.4rem; font-weight: 900; color: #ffffff; }
        .brand-title span { color: var(--danger); }
        .menu-toggle-btn { background: var(--surface-hover); border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }

        /* Iconos de Opciones con Imágenes */
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 10px; }
        .option-card {
            background: linear-gradient(145deg, var(--surface), var(--surface-hover));
            border: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px 16px; gap: 12px; cursor: pointer; position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .option-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(225,29,72,0.2); }
        .nsfw-badge { position: absolute; top: 8px; right: 8px; background: var(--danger); color: white; font-size: 0.6rem; font-weight: 800; padding: 2px 6px; }
        .option-icon-wrapper {
            width: 64px; height: 64px; background: rgba(225,29,72,0.1); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);

        .option-icon-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .option-name { font-size: 0.95rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Sidebar */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 9995; display: none; opacity: 0; transition: opacity 0.3s; }
        .sidebar { position: fixed; top: 0; right: -340px; width: 320px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); z-index: 9996; display: flex; flex-direction: column; padding: 24px; gap: 20px; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; }
        .sidebar.open { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .sidebar-close { background: var(--surface-hover); border: 1px solid var(--border); color: var(--text-main); width: 32px; height: 32px; cursor: pointer; }
        .sidebar-section { display: flex; flex-direction: column; gap: 10px; }
        .sidebar-section h3 { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); }
        .user-status-card { background: var(--bg-base); border: 1px solid var(--border); padding: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; gap: 10px; }
        .upload-form-box { display: flex; flex-direction: column; gap: 8px; background: var(--bg-base); border: 1px solid var(--border); padding: 12px; }
        .upload-form-box input, .upload-form-box select, .upload-form-box textarea { padding: 10px; border: 1px solid var(--border); background: var(--surface); color: white; font-size: 0.85rem; outline: none; }

        /* Creador Cómics */
        .comic-builder-container { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; border: 1px solid var(--border); padding: 8px; background: var(--bg-base); }
        .portada-box { background: #220d14; border: 2px dashed var(--accent); padding: 8px; text-align: center; font-size: 0.75rem; display: flex; flex-direction: column; gap: 4px; }
        .pages-grid-builder { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .page-slot { background: var(--surface); border: 1px solid var(--border); padding: 6px; font-size: 0.7rem; display: flex; flex-direction: column; gap: 2px; }

        /* Secciones Dinámicas */
        .sub-section { display: none; flex-direction: column; gap: 12px; }
        .search-container { position: relative; width: 100%; }
        .search-input { width: 100%; padding: 14px 18px 14px 44px; background: var(--surface); border: 1px solid var(--border); color: var(--text-main); font-size: 0.95rem; outline: none; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .content-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .content-card { background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; }
        .content-thumb { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #000; cursor: pointer; }
        .content-actions { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--surface); }
        .action-btn { width: 100%; padding: 7px 0; background: var(--surface-hover); color: var(--text-main); border: 1px solid var(--border); font-size: 0.7rem; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 4px; }
        .action-btn.open { background: var(--accent); border-color: var(--accent); color: white; }
        .like-btn { background: rgba(225,29,72,0.15); color: var(--accent); border-color: var(--accent); }
        .delete-btn { position: absolute; top: 6px; left: 6px; background: rgba(255, 42, 95, 0.9); color: white; border: none; font-size: 0.65rem; font-weight: 800; padding: 3px 6px; cursor: pointer; z-index: 10; }
        .admin-delete-btn { background: var(--admin); color: black; }
        .back-home-btn { background: var(--surface-hover); color: var(--text-main); border: 1px solid var(--border); padding: 10px; font-weight: 600; cursor: pointer; text-align: center; }

        /* Sixchan */
        .sixchan-feed { display: flex; flex-direction: column; gap: 16px; width: 100%; }
        .sixchan-post { background: var(--surface); border: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 10px; position: relative; }
        .sixchan-post-header { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .sixchan-post-header strong { color: var(--accent); }
        .sixchan-post-body { display: flex; gap: 12px; align-items: flex-start; }
        .sixchan-post-body img { width: 120px; aspect-ratio: 3/4; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
        .sixchan-post-text { font-size: 0.85rem; color: var(--text-main); word-break: break-word; line-height: 1.4; }
        .sixchan-footer { display: flex; justify-content: flex-end; align-items: center; gap: 6px; border-top: 1px solid var(--border); padding-top: 6px; }

        /* Videos */
        .video-list-grid { display: flex; flex-direction: column; gap: 16px; width: 100%; }
        .video-card-item { background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .video-player-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        .video-player-container video { width: 100%; height: 100%; object-fit: cover; }
        .video-card-info { padding: 10px 12px; font-size: 0.85rem; font-weight: 700; color: var(--text-main); text-transform: uppercase; border-top: 1px solid var(--border); background: var(--surface); display: flex; justify-content: space-between; align-items: center; }
        .video-card-info span { color: var(--danger); font-size: 0.7rem; font-weight: 800; background: var(--surface-hover); padding: 2px 6px; border: 1px solid var(--border); }

        /* Visor */
        #viewerModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9990; display: none; flex-direction: column; align-items: center; overflow-y: auto; }
        .viewer-image-container { position: relative; width: 100%; max-width: 600px; height: 65vh; display: flex; justify-content: center; align-items: center; margin-top: 50px; }
        .viewer-image-container img { width: 100%; height: 100%; object-fit: contain; }
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20, 8, 12, 0.85); color: #fff; border: 1px solid var(--border); width: 45px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; z-index: 40; }
        .arrow-left { left: 0; } .arrow-right { right: 0; }
        .btn-back-menu { position: absolute; top: 16px; left: 16px; background: rgba(20, 8, 12, 0.9); color: var(--text-main); border: 1px solid var(--border); padding: 8px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; z-index: 45; }

        .comments-section { width: 100%; max-width: 600px; padding: 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .comments-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; }
        .comment-item { background: var(--bg-base); padding: 8px 12px; border: 1px solid var(--border); font-size: 0.8rem; word-break: break-word; display: flex; align-items: center; gap: 8px; }
        .comment-item strong { color: var(--accent); }
    </style>
</head>

            const videosEnDom = document.querySelectorAll('video');
            
            videosEnDom.forEach(videoEl => {
                const srcAttr = videoEl.getAttribute('src') || (videoEl.querySelector('source') ? videoEl.querySelector('source').getAttribute('src') : '');
                if (srcAttr && srcAttr !== 'intro.mp4') {
                    const yaExiste = Array.from(gridVideos.children).some(card => {
                        const vTag = card.querySelector('video');
                        return vTag && (vTag.getAttribute('src') === srcAttr || vTag.querySelector('source')?.getAttribute('src') === srcAttr);
                    });

                    if (!yaExiste) {
                        let nombreLimpio = srcAttr.split('/').pop().replace('.mp4', '').replace(/[-_]/g, ' ');
                        nombreLimpio = nombreLimpio.charAt(0).toUpperCase() + nombreLimpio.slice(1);

                        const cardItem = document.createElement('div');
                        cardItem.className = 'video-card-item';
                        cardItem.setAttribute('data-title', nombreLimpio.toLowerCase());
                        cardItem.innerHTML = `
                            <div class="video-player-container">
                                <video controls preload="metadata"><source src="${srcAttr}" type="video/mp4"></video>
                            </div>
                            <div class="video-card-info">${nombreLimpio} <span>+18</span></div>
                        `;
                        gridVideos.appendChild(cardItem);
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            escanearEInyectarVideosLocales();
        });

        if (currentUserName) {
            verificarSiEstaBaneado(currentUserName);
        }

        async function verificarSiEstaBaneado(nombre) {
            const q = query(collection(db, "banned_users"), where("usuario", "==", nombre));
            const snap = await getDocs(q);
            if (!snap.empty) {
                alert("🚫 Has sido baneado de devX lujurie.web.");
                cerrarSesionKey();
            }
        }

        if (currentKey && validKeys[currentKey]) {
            desbloquearApp(currentUserName);
        }

        document.getElementById('loginKeyBtn').onclick = () => {
            const val = document.getElementById('keyInput').value.trim();
            if (validKeys[val]) {
                localStorage.setItem('devx_key', val);
                let defaultName = validKeys[val];
                localStorage.setItem('devx_name', defaultName);
                currentKey = val;
                currentUserName = defaultName;
                isAdmin = (val === ADMIN_KEY);
                desbloquearApp(defaultName);
            } else {
                alert("Key incorrecta.");
            }
        };

        window.guardarPerfil = () => {
            const nuevoNombre = document.getElementById('newNameInput').value.trim();
            const avatarFile = document.getElementById('newAvatarFile').files[0];

            if (nuevoNombre) {
                currentUserName = nuevoNombre;
                localStorage.setItem('devx_name', nuevoNombre);
            }

            if (avatarFile) {
                const reader = new FileReader();
                reader.readAsDataURL(avatarFile);
                reader.onload = () => {
                    currentUserAvatar = reader.result;
                    localStorage.setItem('devx_avatar', currentUserAvatar);
                    aplicarCambiosPerfil();
                };
            } else {
                aplicarCambiosPerfil();
            }
        };

        function aplicarCambiosPerfil() {
            document.getElementById('sidebarUserBadge').textContent = "@" + currentUserName;
            document.getElementById('sidebarAvatar').src = currentUserAvatar;
            document.getElementById('newNameInput').value = '';
            alert("¡Perfil actualizado!");
        }

        window.banearUsuario = async () => {
            if (!isAdmin) return;
            const targetUser = document.getElementById('banUserInput').value.trim();
            if (!targetUser) return alert("Escribe un usuario.");
            await addDoc(collection(db, "banned_users"), { usuario: targetUser, timestamp: new Date() });
            document.getElementById('banUserInput').value = '';
            alert(`El usuario @${targetUser} ha sido baneado.`);
        };

        window.cerrarSesionKey = () => {
            localStorage.removeItem('devx_key');
            localStorage.removeItem('devx_name');
            localStorage.removeItem('devx_avatar');
            location.reload();
        };

        function desbloquearApp(nombre) {
            document.getElementById('gatekeeperModal').style.display = 'none';
            document.getElementById('appContainer').classList.add('unlocked');
            document.getElementById('sidebarUserBadge').textContent = "@" + nombre;
            document.getElementById('sidebarAvatar').src = currentUserAvatar;

            if (isAdmin) {
                document.getElementById('sidebarUserRole').textContent = "👑 Administrador";
                document.getElementById('sidebarUserRole').style.color = "var(--admin)";
                document.getElementById('adminPanelBox').style.display = 'flex';
            }
        }

        window.actualizarFormularioSubida = (tipo) => {
            const area = document.getElementById('dynamicUploadArea');
            if (tipo === 'video') {
                area.innerHTML = `<input type="text" id="videoLinkInput" class="auth-input" placeholder="Enlace directo al video (.mp4)" style="text-align:left; font-size:0.8rem;">`;
            } else if (tipo === 'rule') {
                area.innerHTML = `<input type="file" id="singleFile" accept="image/*" style="font-size: 0.75rem;">`;
            } else if (tipo === 'sixchan') {
                area.innerHTML = `
                    <textarea id="sixchanText" class="auth-input" placeholder="Escribe tu texto estilo 4chan..." style="text-align:left; font-size:0.8rem; height:70px;"></textarea>
                    <input type="file" id="singleFile" accept="image/*" style="font-size: 0.75rem;">
                `;
            } else if (tipo === 'comic') {
                let htmlSlots = `
                    <div class="comic-builder-container">
                        <div class="portada-box">
                            <strong>⭐ PORTADA DEL CÓMIC</strong>
                            <input type="file" id="comicPortada" accept="image/*" style="font-size:0.7rem;">
                        </div>
                        <div class="pages-grid-builder">
                `;
                for (let i = 1; i <= 30; i++) {
                    htmlSlots += `
                        <div class="page-slot">
                            <span>Página ${i}</span>
                            <input type="file" id="comicPag_${i}" accept="image/*" style="font-size:0.65rem;">
                        </div>
                    `;
                }
                htmlSlots += `</div></div>`;
                area.innerHTML = htmlSlots;
            }
        };

        window.mostrarSeccion = (idSeccion) => {
            document.getElementById('mainHomeMenu').style.display = 'none';
            document.querySelectorAll('.sub-section').forEach(el => el.style.display = 'none');
            document.getElementById(idSeccion).style.display = 'flex';
        };

        window.volverAlMenuPrincipal = () => {
            document.querySelectorAll('.sub-section').forEach(el => el.style.display = 'none');
            document.getElementById('mainHomeMenu').style.display = 'block';
        };

        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebarMenu');
            const overlay = document.getElementById('sidebarOverlay');
            const isOpen = sidebar.classList.contains('open');
            if (isOpen) {
                sidebar.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                sidebar.classList.add('open');
                overlay.style.display = 'block';
                overlay.style.opacity = '1';
            }
        };

        window.filtrarVideos = (texto) => {
            const val = texto.toLowerCase();
            const cards = document.querySelectorAll('.video-card-item');
            cards.forEach(card => {
                const titulo = card.getAttribute('data-title') || '';
                card.style.display = titulo.includes(val) ? 'flex' : 'none';
            });
        };

        window.terminarVideo = () => {
            const modal = document.getElementById('introVideoModal');
            const video = document.getElementById('introVideo');
            video.pause();
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 600);
            document.getElementById('gatekeeperModal').style.display = 'flex';
        };

        // Redirección a YouTube Kids en caso de seleccionar "No"
        window.confirmarEdad = (esMayor) => {
            if (esMayor) {
                document.getElementById('stepAge').style.display = 'none';
                document.getElementById('stepAuth').style.display = 'flex';
            } else {
                window.location.href = "https://www.youtubekids.com/";
            }
        };
    </script>
</body>
</html>
