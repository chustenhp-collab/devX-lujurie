<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>devX h web - Ultimate Edition</title>
    <style>
        :root {
            --bg-base: #060913;
            --surface: #0f172a;
            --surface-hover: #1e293b;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
        }

        /* --- Intro Video Overlay --- */
        #introVideoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        #introVideoModal video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .skip-video-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(15, 23, 42, 0.7);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            z-index: 10001;
        }

        /* --- Gatekeeper Modal (Edad y Key) --- */
        #gatekeeperModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(6, 9, 19, 0.96);
            backdrop-filter: blur(16px);
            z-index: 9999;
            display: none; /* Se activa tras el video */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .gate-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
        }

        .gate-logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 15px var(--accent);
        }

        .gate-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
        }

        .gate-btns {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:active { transform: scale(0.96); }

        .btn-secondary {
            background: var(--surface-hover);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-secondary:active { transform: scale(0.96); }

        .key-input, .auth-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-base);
            color: #fff;
            text-align: center;
            font-size: 1.05rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .key-input:focus, .auth-input:focus { border-color: var(--accent); }

        .error-txt {
            color: var(--danger);
            font-size: 0.8rem;
            font-weight: 500;
            display: none;
        }

        /* --- App Container --- */
        .app-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            filter: blur(16px);
            pointer-events: none;
            transition: filter 0.5s ease;
        }

        .app-container.unlocked {
            filter: blur(0);
            pointer-events: auto;
        }

        header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-badge {
            font-size: 0.75rem;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 20px;
            color: var(--accent);
            font-weight: 600;
        }

        /* Panel de Control de Cuentas y Subida */
        .dashboard-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .btn-upload-toggle {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Formulario oculto para subir cómic (Límite 2) */
        .upload-form-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 4px;
        }

        .upload-form-container.active {
            display: flex;
        }

        .upload-input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .upload-input-group input {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-base);
            color: white;
            font-size: 0.85rem;
        }

        .comics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .comic-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .comic-thumb {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            background: #000;
            cursor: pointer;
        }

        .comic-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
            background: var(--surface);
        }

        .action-btn {
            width: 100%;
            padding: 6px 0;
            background: var(--surface-hover);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .action-btn.open {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .action-btn:active { transform: scale(0.96); }

        .placeholder-box {
            width: 100%;
            aspect-ratio: 3 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-hover);
            font-size: 0.65rem;
            color: var(--text-muted);
            border-radius: 14px 14px 0 0;
            text-align: center;
            padding: 5px;
        }

        /* --- Visor de Cómics --- */
        #viewerModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9990;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .viewer-image-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            position: absolute;
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 5;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .viewer-image-container img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.1s ease;
            z-index: 10;
        }

        .viewer-image-container img.loaded {
            opacity: 1;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.7);
            color: #fff;
            border: 1px solid var(--border);
            width: 50px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 40;
            backdrop-filter: blur(4px);
            user-select: none;
        }

        .nav-arrow:active { background: var(--accent); }
        .arrow-left { left: 4px; border-radius: 0 12px 12px 0; }
        .arrow-right { right: 4px; border-radius: 12px 0 0 12px; }

        .btn-back-menu {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(15, 23, 42, 0.85);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 45;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <!-- 1. Video de Inicio de 4 Segundos -->
    <div id="introVideoModal">
        <video id="introVideo" src="intro.mp4" autoplay muted playsinline></video>
        <button class="skip-video-btn" onclick="terminarVideo()">Omitir ❯</button>
    </div>

    <!-- 2. Gatekeeper (Edad y Key) -->
    <div id="gatekeeperModal">
        <div class="gate-card" id="stepAge">
            <div class="gate-logo">devX h web</div>
            <div class="gate-title">¿Tienes más de 18 años?</div>
            <div class="gate-btns">
                <button class="btn btn-primary" onclick="confirmarEdad(true)">Sí</button>
                <button class="btn btn-secondary" onclick="confirmarEdad(false)">No</button>
            </div>
        </div>

        <div class="gate-card" id="stepKey" style="display: none;">
            <div class="gate-logo">devX h web</div>
            <div class="gate-title">Ingresa tu Key de Acceso</div>
            <input type="password" id="accessKeyInput" class="key-input" placeholder="chusten">
            <div class="error-txt" id="keyError">Key incorrecta. Inténtalo de nuevo.</div>
            <button class="btn btn-primary" onclick="validarKey()">Acceder</button>
        </div>

        <!-- Sistema de Cuentas Integrado -->
        <div class="gate-card" id="stepAuth" style="display: none;">
            <div class="gate-logo">Portal de Cuentas</div>
            <div class="gate-title" id="authTitle">Inicia sesión o regístrate</div>
            <input type="text" id="usernameInput" class="auth-input" placeholder="Nombre de usuario">
            <input type="password" id="passwordInput" class="auth-input" placeholder="Contraseña">
            <div class="error-txt" id="authError">Completa los campos correctamente.</div>
            <div class="gate-btns">
                <button class="btn btn-primary" onclick="manejarAuth('login')">Entrar</button>
                <button class="btn btn-secondary" onclick="manejarAuth('register')">Registrarse</button>
            </div>
        </div>
    </div>

    <!-- 3. Contenido Principal de la App -->
    <div class="app-container" id="appContainer">
        <header>
            <h1>devX h web</h1>
            <div class="user-badge" id="currentUserBadge">Invitado</div>
        </header>

        <!-- Panel de Usuario para Subir Cómics (Máximo 2) -->
        <div class="dashboard-panel" id="userDashboard" style="display: none;">
            <div class="dashboard-header">
                <span id="userComicCount">Tus cómics subidos: 0 / 2</span>
                <button class="btn-upload-toggle" onclick="toggleFormularioSubida()">+ Subir Comic</button>
            </div>

            <div class="upload-form-container" id="uploadForm">
                <div class="upload-input-group">
                    <label>Título del Comic:</label>
                    <input type="text" id="newComicTitle" placeholder="Ej. Mi Aventura">
                </div>
                <div class="upload-input-group">
                    <label>Imagen de Portada (JPG):</label>
                    <input type="file" id="newComicCover" accept="image/jpeg">
                </div>
                <button class="btn btn-primary" style="padding: 8px; font-size: 0.8rem;" onclick="subirComicUsuario()">Publicar Comic</button>
            </div>
        </div>

        <!-- Cuadrícula de Cómics -->
        <div class="comics-grid" id="comicsGrid">
            <!-- Comics oficiales predeterminados -->
            <div class="comic-card">
                <img id="thumb1" class="comic-thumb" src="comic1/portada1.jpg" alt="Konosuba" onclick="abrirComic(1, true)">
                <div class="comic-actions">
                    <button class="action-btn open" onclick="abrirComic(1, true)">Abrir</button>
                    <a href="comic1/comic1.zip" class="action-btn" download>Descargar</a>
                </div>
            </div>

            <div class="comic-card">
                <img id="thumb2" class="comic-thumb" src="comic2/1t.jpg" alt="Jane Doe" onclick="abrirComic(2, true)">
                <div class="comic-actions">
                    <button class="action-btn open" onclick="abrirComic(2, true)">Abrir</button>
                    <a href="comic2/comic2.zip" class="action-btn" download>Descargar</a>
                </div>
            </div>

            <div class="comic-card">
                <img id="thumb3" class="comic-thumb" src="comic3/1r.jpg" alt="Tonikaku" onclick="abrirComic(3, true)">
                <div class="comic-actions">
                    <button class="action-btn open" onclick="abrirComic(3, true)">Abrir</button>
                    <a href="comic3/comic3.zip" class="action-btn" download>Descargar</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. Visor de Cómics -->
    <div id="viewerModal">
        <button class="btn-back-menu" onclick="cerrarVisor()">Volver</button>
        <div class="viewer-image-container">
            <div class="loading-spinner"></div>
            <div class="nav-arrow arrow-left" onclick="cambiarPagina(-1)">‹</div>
            <div class="nav-arrow arrow-right" onclick="cambiarPagina(1)">›</div>
            <img id="comicImg" src="" alt="Página">
        </div>
    </div>

    <script>
        let comicActual = 1;
        let paginaActual = 0;
        let esComicUsuario = false;
        let usuarioLogueado = null;

        const configs = {
            1: { max: 16 },
            2: { max: 25 },
            3: { max: 24 }
        };

        const cacheImgs = {};

        // Control del Video de Inicio (4 segundos)
        const videoElement = document.getElementById('introVideo');
        
        videoElement.addEventListener('timeupdate', () => {
            if (videoElement.currentTime >= 4.0) {
                terminarVideo();
            }
        });

        function terminarVideo() {
            const modalVideo = document.getElementById('introVideoModal');
            modalVideo.style.opacity = '0';
            setTimeout(() => {
                modalVideo.style.display = 'none';
                document.getElementById('gatekeeperModal').style.display = 'flex';
            }, 600);
        }

        function confirmarEdad(esMayor) {
            if (!esMayor) {
                window.location.href = "https://www.google.com";
            } else {
                document.getElementById('stepAge').style.display = 'none';
                document.getElementById('stepKey').style.display = 'flex';
            }
        }

        function validarKey() {
            const input = document.getElementById('accessKeyInput').value;
            const error = document.getElementById('keyError');
            
            if (input === "chusten") {
                document.getElementById('stepKey').style.display = 'none';
                document.getElementById('stepAuth').style.display = 'flex';
            } else {
                error.style.display = 'block';
            }
        }

        // Sistema de Cuentas Local
        function manejarAuth(tipo) {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const error = document.getElementById('authError');

            if (!user || !pass) {
                error.style.display = 'block';
                return;
            }

            let cuentas = JSON.parse(localStorage.getItem('devX_cuentas') || '{}');

            if (tipo === 'register') {
                if (cuentas[user]) {
                    error.textContent = "El usuario ya existe. Inicia sesión.";
                    error.style.display = 'block';
                    return;
                }
                cuentas[user] = { pass: pass, comics: [] };
                localStorage.setItem('devX_cuentas', JSON.stringify(cuentas));
            } else {
                if (!cuentas[user] || cuentas[user].pass !== pass) {
                    error.textContent = "Usuario o contraseña incorrectos.";
                    error.style.display = 'block';
                    return;
                }
            }

            usuarioLogueado = user;
            localStorage.setItem('devX_sesion_activa', user);
            iniciarSesionExitosa();
        }

        function iniciarSesionExitosa() {
            document.getElementById('gatekeeperModal').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('gatekeeperModal').style.display = 'none';
            }, 400);
            document.getElementById('appContainer').classList.add('unlocked');
            document.getElementById('currentUserBadge').textContent = "@" + usuarioLogueado;
            document.getElementById('userDashboard').style.display = 'flex';
            cargarComicsUsuario();
        }

        function toggleFormularioSubida() {
            const form = document.getElementById('uploadForm');
            form.classList.toggle('active');
        }

        // Lógica para subir Cómics (Límite estricto de 2 por usuario)
        function subirComicUsuario() {
            const titulo = document.getElementById('newComicTitle').value.trim();
            const archivoInput = document.getElementById('newComicCover');

            if (!titulo || archivoInput.files.length === 0) {
                alert("Por favor ingresa un título y selecciona una imagen de portada.");
                return;
            }

            let cuentas = JSON.parse(localStorage.getItem('devX_cuentas') || '{}');
            let misComics = cuentas[usuarioLogueado].comics || [];

            if (misComics.length >= 2) {
                alert("Has alcanzado el límite máximo permitido de 2 cómics por cuenta.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                
                const nuevoComic = {
                    id: 'usr_' + Date.now(),
                    titulo: titulo,
                    portada: base64Image,
                    paginas: [base64Image] // Simulación de páginas con la portada
                };

                misComics.push(nuevoComic);
                cuentas[usuarioLogueado].comics = misComics;
                localStorage.setItem('devX_cuentas', JSON.stringify(cuentas));

                document.getElementById('newComicTitle').value = '';
                archivoInput.value = '';
                toggleFormularioSubida();
                cargarComicsUsuario();
                alert("¡Comic publicado con éxito!");
            };
            reader.readAsDataURL(archivoInput.files[0]);
        }

        function cargarComicsUsuario() {
            let cuentas = JSON.parse(localStorage.getItem('devX_cuentas') || '{}');
            let misComics = (cuentas[usuarioLogueado] && cuentas[usuarioLogueado].comics) || [];
            
            document.getElementById('userComicCount').textContent = `Tus cómics subidos: ${misComics.length} / 2`;

            // Renderizar en la interfaz
            const grid = document.getElementById('comicsGrid');
            
            // Mantener los 3 oficiales y agregar los del usuario
            let htmlOficial = `
                <div class="comic-card">
                    <img id="thumb1" class="comic-thumb" src="comic1/portada1.jpg" alt="Konosuba" onclick="abrirComic(1, true)">
                    <div class="comic-actions"><button class="action-btn open" onclick="abrirComic(1, true)">Abrir</button><a href="comic1/comic1.zip" class="action-btn" download>Descargar</a></div>
                </div>
                <div class="comic-card">
                    <img id="thumb2" class="comic-thumb" src="comic2/1t.jpg" alt="Jane Doe" onclick="abrirComic(2, true)">
                    <div class="comic-actions"><button class="action-btn open" onclick="abrirComic(2, true)">Abrir</button><a href="comic2/comic2.zip" class="action-btn" download>Descargar</a></div>
                </div>
                <div class="comic-card">
                    <img id="thumb3" class="comic-thumb" src="comic3/1r.jpg" alt="Tonikaku" onclick="abrirComic(3, true)">
                    <div class="comic-actions"><button class="action-btn open" onclick="abrirComic(3, true)">Abrir</button><a href="comic3/comic3.zip" class="action-btn" download>Descargar</a></div>
                </div>
            `;

            misComics.forEach((comic, idx) => {
                htmlOficial += `
                    <div class="comic-card">
                        <img class="comic-thumb" src="${comic.portada}" alt="${comic.titulo}" onclick="abrirComicPersonalizado('${comic.id}')">
                        <div class="comic-actions">
                            <button class="action-btn open" onclick="abrirComicPersonalizado('${comic.id}')">Abrir</button>
                            <span class="action-btn" style="background:var(--surface); color:var(--text-muted)">${comic.titulo}</span>
                        </div>
                    </div>
                `;
            });

            // Completar slots vacíos hasta 6 si es necesario
            const totalSlots = 3 + misComics.length;
            for(let i = totalSlots + 1; i <= 6; i++) {
                htmlOficial += `<div class="comic-card"><div class="placeholder-box">+ Slot ${i}</div></div>`;
            }

            grid.innerHTML = htmlOficial;
        }

        function obtenerUrl(c, n) {
            if (c === 1) return n === 0 ? "comic1/portada1.jpg" : `comic1/${n}.jpg`;
            if (c === 2) return n === 0 ? "comic2/1t.jpg" : `comic2/${n}t.jpg`;
            if (c === 3) return n === 0 ? "comic3/1r.jpg" : `comic3/${n}r.jpg`;
        }

        function abrirComic(id) {
            comicActual = id;
            paginaActual = 0;
            esComicUsuario = false;
            document.getElementById('viewerModal').style.display = 'flex';
            actualizarVista();
        }

        function abrirComicPersonalizado(comicId) {
            let cuentas = JSON.parse(localStorage.getItem('devX_cuentas') || '{}');
            let misComics = (cuentas[usuarioLogueado] && cuentas[usuarioLogueado].comics) || [];
            let comicEncontrado = misComics.find(c => c.id === comicId);

            if (comicEncontrado) {
                comicActual = comicEncontrado;
                paginaActual = 0;
                esComicUsuario = true;
                document.getElementById('viewerModal').style.display = 'flex';
                actualizarVistaPersonalizada();
            }
        }

        function cerrarVisor() {
            document.getElementById('viewerModal').style.display = 'none';
        }

        function actualizarVista() {
            const img = document.getElementById('comicImg');
            const urlActual = obtenerUrl(comicActual, paginaActual);

            img.classList.remove('loaded');
            img.src = urlActual;
            img.onload = () => { img.classList.add('loaded'); };
        }

        function actualizarVistaPersonalizada() {
            const img = document.getElementById('comicImg');
            img.classList.remove('loaded');
            img.src = comicActual.paginas[paginaActual];
            img.onload = () => { img.classList.add('loaded'); };
        }

        function cambiarPagina(dir) {
            if (!esComicUsuario) {
                const max = configs[comicActual].max;
                let nueva = paginaActual + dir;
                if (nueva >= 0 && nueva <= max) {
                    paginaActual = nueva;
                    actualizarVista();
                }
            } else {
                const max = comicActual.paginas.length - 1;
                let nueva = paginaActual + dir;
                if (nueva >= 0 && nueva <= max) {
                    paginaActual = nueva;
                    actualizarVistaPersonalizada();
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('viewerModal').style.display === 'flex') {
                if (e.key === 'ArrowRight' || e.key === ' ') cambiarPagina(1);
                if (e.key === 'ArrowLeft') cambiarPagina(-1);
            }
        });
    </script>
</body>
</html>
